name: Backend CI

on:
  push:
    branches:
      - main
    paths:
      - 'backend/**'
      - '.github/workflows/backend-ci.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'backend/**'
      - '.github/workflows/backend-ci.yml'

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: backend-ci-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE_NAME: ${{ github.repository }}/backend

jobs:
  ci:
    name: Backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      REDIS_HOST: 127.0.0.1
      REDIS_PORT: 6379
      NODE_ENV: test
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Start Redis
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y redis-server
          sudo systemctl start redis-server
          redis-cli ping

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Cache node_modules
        id: node-modules-cache
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: backend/node_modules
          key: ${{ runner.os }}-backend-node_modules-${{ hashFiles('backend/package-lock.json') }}
          restore-keys: ${{ runner.os }}-backend-node_modules-

      - name: Install dependencies
        if: steps.node-modules-cache.outputs.cache-hit != 'true'
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Test
        run: npm test

  migration-diff:
    name: Schema migration dry-run
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: prisma
          POSTGRES_PASSWORD: prisma
          POSTGRES_DB: niffyinsure_diff
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://prisma:prisma@localhost:5432/niffyinsure_diff
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Cache node_modules
        id: node-modules-cache
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: backend/node_modules
          key: ${{ runner.os }}-backend-node_modules-${{ hashFiles('backend/package-lock.json') }}
          restore-keys: ${{ runner.os }}-backend-node_modules-

      - name: Install dependencies
        if: steps.node-modules-cache.outputs.cache-hit != 'true'
        run: npm ci

      - name: Apply existing migrations to shadow DB
        run: npx prisma migrate deploy

      - name: Generate migration diff
        id: diff
        run: |
          npx prisma migrate diff \
            --from-local-db \
            --to-schema-datamodel prisma/schema.prisma \
            --script \
            --exit-code \
            > migration-diff.sql 2>&1 || true
          cat migration-diff.sql

      - name: Upload migration diff artifact
        uses: actions/upload-artifact@6f51ac03b9356f520e9adb1b1b7802705f340c2b # v4.5.0
        with:
          name: migration-diff-${{ github.sha }}
          path: backend/migration-diff.sql
          retention-days: 30

      - name: Fail on destructive changes (unless bypass label is present)
        run: |
          BYPASS_LABEL="migration-bypass-destructive"
          LABELS=$(gh pr view ${{ github.event.pull_request.number }} --json labels --jq '.labels[].name' 2>/dev/null || echo "")

          if echo "$LABELS" | grep -qx "$BYPASS_LABEL"; then
            echo "::warning::Bypass label '$BYPASS_LABEL' detected — skipping destructive-change check. This requires explicit reviewer approval."
            exit 0
          fi

          if grep -qiE '^\s*(DROP\s+(TABLE|COLUMN|INDEX|CONSTRAINT)|ALTER\s+TABLE\s+\S+\s+(DROP|ALTER COLUMN))' migration-diff.sql 2>/dev/null; then
            echo "::error::Migration diff contains destructive changes (DROP or ALTER with data loss)."
            echo "::error::Review migration-diff.sql artifact and add the '$BYPASS_LABEL' label if intentional."
            echo "Detected destructive statements:"
            grep -iE '^\s*(DROP\s+(TABLE|COLUMN|INDEX|CONSTRAINT)|ALTER\s+TABLE\s+\S+\s+(DROP|ALTER COLUMN))' migration-diff.sql
            exit 1
          fi

          echo "No destructive changes detected."
        env:
          GH_TOKEN: ${{ github.token }}
